<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6f5db"/>
      <stop offset="100%" stop-color="#9bc4a8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg2)"/>
  <!-- Card -->
  <rect x="90" y="35" width="420" height="270" rx="7" fill="#f0f5e9" opacity="0.95"/>
  <!-- Header -->
  <text x="115" y="70" fill="#172a23" font-family="sans-serif" font-size="16" font-weight="bold">GEAR<tspan fill="#61956c">UP.</tspan></text>
  <text x="410" y="68" fill="#172a23" font-family="monospace" font-size="7">WORKSHOP MANAGEMENT</text>
  <line x1="115" y1="80" x2="485" y2="80" stroke="#b7c9b9" stroke-width="1"/>
  <!-- Title -->
  <text x="115" y="120" fill="#172a23" font-family="sans-serif" font-size="32" font-weight="bold">Everything</text>
  <text x="115" y="155" fill="#172a23" font-family="sans-serif" font-size="32">in <tspan font-family="Georgia,serif" fill="#5b986a" font-style="italic">motion.</tspan></text>
  <!-- Lines -->
  <rect x="115" y="175" width="150" height="4" rx="2" fill="#cbd9c7"/>
  <rect x="115" y="185" width="150" height="4" rx="2" fill="#cbd9c7"/>
  <rect x="115" y="195" width="100" height="4" rx="2" fill="#cbd9c7"/>
  <!-- Wheel -->
  <circle cx="450" cy="270" r="65" fill="none" stroke="#233c31" stroke-width="16"/>
  <circle cx="450" cy="270" r="40" fill="none" stroke="#71967a" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Vertical label -->
  <text x="490" y="170" fill="#172a23" font-family="monospace" font-size="7" transform="rotate(90 490 170)">SERVICE / 02</text>
  <!-- Label -->
  <text x="80" y="325" fill="#3a6a45" font-family="monospace" font-size="9">CONCEPT / 002</text>
</svg>
